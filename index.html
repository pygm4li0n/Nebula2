<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03010a">
<title>NEBULA — Diamond Hands Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#f4efff;--dim:#8b82b0;--line:rgba(180,160,255,.14);
  --accent1:#ff3eb5;--accent2:#7a4bff;--accent3:#00d4ff;
  --glass:rgba(12,7,28,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03010a;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}
canvas.d{cursor:grabbing}
canvas.h{cursor:pointer}

/* ── header ─────────────────────────────────── */
#hdr{position:fixed;top:0;left:0;right:0;padding:calc(20px + env(safe-area-inset-top,0px)) 26px 20px;
  display:flex;align-items:center;gap:28px;z-index:6;pointer-events:none}
#hdr>*{pointer-events:auto}
.brand{pointer-events:none}
.brand h1{font:800 clamp(22px,3.2vw,34px)/1 Unbounded,sans-serif;letter-spacing:.14em;
  background:linear-gradient(100deg,#ffd98a 0%,#ff3eb5 42%,#7a4bff 75%,#00d4ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,62,181,.35))}
.brand .sub{color:var(--dim);font-size:11px;letter-spacing:.42em;text-transform:uppercase;margin-top:10px;font-weight:500}
.status{color:var(--dim);font-size:13px;letter-spacing:.02em;
  display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:auto;
  padding:9px 18px;border:1px solid var(--line);border-radius:99px;
  background:var(--glass);backdrop-filter:blur(14px);white-space:nowrap}
.status .sep{opacity:.35}
.status b{color:var(--ink);font-weight:500}
.actions{display:flex;gap:9px;margin-left:auto}
.btn{padding:10px 18px;border:1px solid var(--line);border-radius:12px;
  background:var(--glass);backdrop-filter:blur(14px);cursor:pointer;
  font-size:13px;font-weight:500;letter-spacing:.02em;transition:all .18s}
.btn:hover{border-color:rgba(255,255,255,.35);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(100deg,var(--accent1),var(--accent2));border:0;
  box-shadow:0 6px 24px rgba(122,75,255,.35)}
.btn.primary:hover{box-shadow:0 8px 30px rgba(122,75,255,.55)}

/* ── side panel ─────────────────────────────── */
#panel{position:fixed;top:0;right:0;height:100%;width:min(400px,92vw);z-index:8;
  padding:calc(28px + env(safe-area-inset-top,0px)) 30px calc(28px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(12,7,28,.94),rgba(6,3,18,.96));
  backdrop-filter:blur(24px);border-left:1px solid rgba(155,199,255,.18);
  transform:translateX(100%);transition:transform .55s cubic-bezier(.16,1,.3,1);
  pointer-events:none;overflow-y:auto}
#panel.open{transform:translateX(0);pointer-events:auto}
#panel::before{content:'';position:absolute;top:0;left:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(155,199,255,.5),transparent)}
.p-close{position:absolute;top:22px;right:22px;width:32px;height:32px;padding:0;border:0;
  border-radius:9px;background:rgba(255,255,255,.06);color:var(--ink);font-size:18px;
  line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.p-close:hover{background:rgba(255,255,255,.16)}
.p-eyebrow{color:var(--dim);font-size:11px;letter-spacing:.32em;text-transform:uppercase;
  margin-bottom:14px;font-weight:500}
#p-name{font:800 26px/1.15 Unbounded,sans-serif;letter-spacing:.01em;margin-bottom:14px;
  background:linear-gradient(120deg,#fff, #c9b8ff);-webkit-background-clip:text;
  background-clip:text;color:transparent;padding-right:36px;word-break:break-word}
#p-addr{display:block;color:#9bc7ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:1.5;word-break:break-all;padding:11px 13px;
  background:rgba(155,199,255,.06);border:1px solid rgba(155,199,255,.15);
  border-radius:10px;margin-bottom:24px;letter-spacing:.01em}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.metric{padding:14px 15px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.025)}
.metric .k{color:var(--dim);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  margin-bottom:7px;font-weight:500}
.metric .v{font:600 17px 'Space Grotesk';letter-spacing:.01em;color:var(--ink)}
.metric.wide{grid-column:1/-1}
.metric.wide .v{font:800 22px 'Unbounded',sans-serif;
  background:linear-gradient(100deg,#ffd98a,#ff3eb5);-webkit-background-clip:text;
  background-clip:text;color:transparent}
#p-scan{display:block;width:100%;padding:16px 20px;border-radius:13px;text-align:center;
  background:linear-gradient(100deg,#9bc7ff,#c9dcff);color:#0a1230;font-weight:700;
  font-size:14px;letter-spacing:.02em;cursor:pointer;border:0;
  box-shadow:0 10px 34px rgba(155,199,255,.28);transition:all .18s}
#p-scan:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(155,199,255,.42)}
#p-scan:active{transform:translateY(0)}
.p-note{margin-top:18px;color:var(--dim);font-size:12px;line-height:1.55;text-align:center}

/* ── bottom controls ────────────────────────── */
#zm{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:9px;z-index:5}
#zm button{width:44px;height:44px;padding:0;font-size:20px;font-weight:400}
#hint{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  color:var(--dim);font-size:12.5px;letter-spacing:.02em;max-width:340px;line-height:1.6;
  z-index:5;pointer-events:none;opacity:.75}
#tip{position:fixed;z-index:7;pointer-events:none;padding:12px 15px;
  border:1px solid var(--line);border-radius:12px;background:rgba(10,6,22,.94);
  font-size:12.5px;line-height:1.55;display:none;white-space:nowrap;
  backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#tip b{font-size:14px;color:#fff}
#tip i{color:var(--dim);font-style:normal}
#tip .go{display:block;margin-top:6px;color:#9bc7ff;font-size:11px;letter-spacing:.04em}

/* wallet panel (bottom-left when connected) */
#me{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:min(300px,calc(100vw - 100px));padding:16px 18px;z-index:5;
  border:1px solid var(--line);border-radius:16px;background:var(--glass);
  backdrop-filter:blur(16px);transition:opacity .3s}
#me b{display:block;font:800 15px Unbounded,sans-serif;letter-spacing:.01em}
#me span{display:block;color:var(--dim);font-size:13px;margin:7px 0 12px;line-height:1.5}
#nb{display:flex;gap:8px}
#nb input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.05);outline:0;font-size:13px}
#nb input:focus{border-color:rgba(155,199,255,.5)}
#nb button{padding:9px 15px;border:0;border-radius:10px;background:#fff;color:#150a28;
  font-weight:600;font-size:13px;cursor:pointer}
#nb button:hover{background:#e8e8f0}
@media(max-width:720px){
  #hdr{flex-wrap:wrap;gap:14px;padding:16px 18px 14px}
  .status{order:3;flex-basis:100%;justify-content:center;margin:0;font-size:12px}
  .brand .sub{letter-spacing:.32em;font-size:10px}
  .btn{padding:9px 14px;font-size:12px}
  #hint{display:none}
  #me{left:18px;right:18px;bottom:90px;width:auto}
  #panel{width:100%;border-left:0}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<header id="hdr">
  <div class="brand">
    <h1>NEBULA</h1>
    <div class="sub">Diamond Hands Galaxy</div>
  </div>
  <div class="status" id="status">
    <span id="st-count">—</span>
    <span class="sep">·</span>
    <span id="st-age">—</span>
    <span class="sep">·</span>
    <span id="st-total">—</span>
  </div>
  <div class="actions">
    <button class="btn" id="btn-sync" hidden>Sync</button>
    <button class="btn" id="btn-find" hidden>Find me</button>
    <button class="btn primary" id="btn-connect">Connect</button>
  </div>
</header>

<aside id="panel" aria-hidden="true">
  <button class="p-close" id="p-close" aria-label="Close">×</button>
  <div class="p-eyebrow" id="p-eyebrow">Holder</div>
  <h2 id="p-name">—</h2>
  <code id="p-addr">—</code>
  <div class="metrics">
    <div class="metric wide">
      <div class="k">Balance</div>
      <div class="v" id="p-bal">—</div>
    </div>
    <div class="metric">
      <div class="k">Held for</div>
      <div class="v" id="p-held">—</div>
    </div>
    <div class="metric">
      <div class="k">Rank</div>
      <div class="v" id="p-rank">—</div>
    </div>
  </div>
  <a id="p-scan" href="#" target="_blank" rel="noopener noreferrer">View on Solscan ↗</a>
  <div class="p-note">Verify this wallet on-chain. Opens in a new tab.</div>
</aside>

<div id="zm">
  <button class="btn" id="zi">+</button>
  <button class="btn" id="zo">−</button>
</div>

<div id="hint">Drag to pan · scroll to zoom · click a star to inspect it</div>

<div id="me" hidden>
  <b id="m1"></b>
  <span id="m2"></span>
  <div id="nb"><input id="nm" maxlength="20" placeholder="Display name"><button id="sv">Save</button></div>
</div>

<div id="tip"></div>

<script>
'use strict';

// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const CONFIG = {
  SUPABASE_URL      : 'https://alacrboutohcxlbaucti.supabase.co',
  SUPABASE_ANON_KEY : 'sb_publishable_1dkjqvUt03MhL4bqNtEnqw_zcIk8uyB',
  HELIUS_URL        : 'https://mainnet.helius-rpc.com/?api-key=fa7e6515-19de-45de-a7d1-35a64a0d9a1a',
  TOKEN_MINT        : '9cRCn9rGT8V2imeM2BaKs13yhMEais3ruM3rPvTGpump',
  EXCLUDE           : [],
  DEV_WALLET        : 'GKpgaSMUeUPD2AjXb9eiXsbQ1qm6YfGrYY6hHvNgqNJc',
  EXPLORER          : 'https://solscan.io/account/',
  TICKER            : '$ANSEM',
  REFRESH_MS        : 300000,
};

// ─────────────────────────────────────────────
// utils
// ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
const R = (a,b) => a + Math.random()*(b-a);
const short = w => w.slice(0,4) + '…' + w.slice(-4);
const cmp = new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2});
const dur = ms => {
  const d = ms/864e5|0, h = ms/36e5%24|0, m = ms/6e4%60|0;
  return d ? d+'d '+h+'h' : h ? h+'h '+m+'m' : m+'m';
};

const LIVE  = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const HELIUS= !!(CONFIG.HELIUS_URL && CONFIG.TOKEN_MINT);
const EXCLUDE_SET = new Set(CONFIG.EXCLUDE.map(s => s.toLowerCase()));

function SB(extra){
  const k = CONFIG.SUPABASE_ANON_KEY;
  const h = { apikey:k, 'Content-Type':'application/json' };
  if (k.startsWith('eyJ')) h['Authorization'] = 'Bearer ' + k;
  return extra ? Object.assign(h, extra) : h;
}

function fetchT(url, opts = {}, ms = 12000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal })
    .finally(() => clearTimeout(timer));
}

// ─────────────────────────────────────────────
// canvas setup
// ─────────────────────────────────────────────
const cv = $('c');
const g  = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width  = W * DPR;
  cv.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#03010a';
  g.fillRect(0, 0, W, H);
}
addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────
// state
// ─────────────────────────────────────────────
let T = 0;
let stars = [];        // visible stars (holders + ghost + dev placeholder)
let dust  = [];        // decorative unclickable particles
let rows  = [];        // raw rows from Supabase
let me    = null;      // connected wallet
let mine  = null;      // my star object (if any)
let hov   = null;      // hovered star
let selected = null;   // selected star
let mouse = { x:-9999, y:-9999 };
let cam   = { x:0, y:0, z:1 };
let camTarget = null;
let drag = null, down = null;

const MAXR = 560;
const DEFAULT_Z = Math.min(W, H) / 1050;
cam.z = DEFAULT_Z;

// ─────────────────────────────────────────────
// sprite cache — pre-rendered glowing stars
// ─────────────────────────────────────────────
const SPRITE_SIZE = 128;
const spriteCache = new Map();
function buildStarSprite(hue){
  const s = SPRITE_SIZE, cc = s/2;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');

  // soft outer glow
  const glow = x.createRadialGradient(cc, cc, 0, cc, cc, cc);
  glow.addColorStop(0,    `hsla(${hue}, 100%, 78%, .70)`);
  glow.addColorStop(.14,  `hsla(${hue}, 100%, 72%, .38)`);
  glow.addColorStop(.34,  `hsla(${hue}, 100%, 62%, .12)`);
  glow.addColorStop(.66,  `hsla(${hue}, 100%, 55%, .025)`);
  glow.addColorStop(1,    `hsla(${hue}, 100%, 55%, 0)`);
  x.fillStyle = glow;
  x.fillRect(0, 0, s, s);

  // bright core
  x.globalCompositeOperation = 'lighter';
  const core = x.createRadialGradient(cc, cc, 0, cc, cc, s*.14);
  core.addColorStop(0,   '#ffffff');
  core.addColorStop(.28, `hsla(${hue}, 100%, 94%, .98)`);
  core.addColorStop(.6,  `hsla(${hue}, 100%, 80%, .55)`);
  core.addColorStop(1,   `hsla(${hue}, 100%, 70%, 0)`);
  x.fillStyle = core;
  x.fillRect(0, 0, s, s);

  return c;
}
function getSprite(hue){
  const b = Math.round(hue/10)*10;
  const k = ((b % 360) + 360) % 360;
  if (!spriteCache.has(k)) spriteCache.set(k, buildStarSprite(k));
  return spriteCache.get(k);
}

// nebula background sprite
let nebula = null;
function buildNebula(){
  const size = 1024, cc = size/2;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const blobs = [
    { x:cc*.55, y:cc*.5,  r:cc*.9,  h:280, a:.14 },
    { x:cc*.45, y:cc*.55, r:cc*.75, h:320, a:.11 },
    { x:cc*.5,  y:cc*.45, r:cc*.6,  h:45,  a:.07 },
    { x:cc*.6,  y:cc*.6,  r:cc*.5,  h:220, a:.09 },
  ];
  blobs.forEach(b => {
    const grd = x.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0,  `hsla(${b.h}, 85%, 55%, ${b.a})`);
    grd.addColorStop(.5, `hsla(${b.h}, 85%, 50%, ${b.a*.4})`);
    grd.addColorStop(1,  `hsla(${b.h}, 85%, 50%, 0)`);
    x.fillStyle = grd;
    x.fillRect(0, 0, size, size);
  });
  return c;
}
nebula = buildNebula();

// ─────────────────────────────────────────────
// Helius — fetch top holders
// ─────────────────────────────────────────────
async function fetchTopHolders(){
  // 1) standard Solana RPC — browser-safe, no DAS rate limits
  const r = await fetchT(CONFIG.HELIUS_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      jsonrpc:'2.0', id:'largest',
      method:'getTokenLargestAccounts',
      params:[CONFIG.TOKEN_MINT, { commitment:'confirmed' }]
    })
  }, 12000);
  if (!r.ok) throw new Error('helius ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error('helius rpc: ' + JSON.stringify(j.error));
  const accounts = j?.result?.value ?? [];
  console.log('[nebula] Helius returned', accounts.length, 'largest token accounts');
  if (!accounts.length) return [];

  // 2) resolve token-account → owner wallet
  const addrs = accounts.map(a => a.address);
  const r2 = await fetchT(CONFIG.HELIUS_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      jsonrpc:'2.0', id:'owners',
      method:'getMultipleAccounts',
      params:[addrs, { encoding:'jsonParsed' }]
    })
  }, 12000);
  if (!r2.ok) throw new Error('owners ' + r2.status);
  const j2 = await r2.json();
  const vals = j2?.result?.value ?? [];

  const out = [];
  for (let i = 0; i < accounts.length; i++){
    const a = accounts[i];
    const info = vals[i]?.data?.parsed?.info;
    const owner = info?.owner;
    const amount = a.uiAmount ?? (Number(a.amount) / 1e6);
    if (!owner || !amount) continue;
    if (EXCLUDE_SET.has(owner.toLowerCase())) continue;
    out.push({ wallet: owner, amount });
  }
  console.log('[nebula] resolved', out.length, 'owner wallets');
  return out;
}

// ─────────────────────────────────────────────
// Supabase — write / read
// ─────────────────────────────────────────────
async function pushToSupabase(holders){
  if (!holders.length || !LIVE) return;
  const now = new Date().toISOString();
  const payload = holders.map(h => ({
    wallet: h.wallet, amount: h.amount, last_seen: now
  }));
  for (let i = 0; i < payload.length; i += 500){
    const chunk = payload.slice(i, i + 500);
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/holders`, {
      method:'POST',
      headers: SB({ 'Prefer':'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(chunk)
    });
    if (!r.ok) throw new Error('upsert ' + r.status + ' ' + (await r.text()));
  }
  // prune stale
  const cutoff = new Date(Date.now() - 5*60*1000).toISOString();
  await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/holders?last_seen=lt.${cutoff}`, {
    method:'DELETE', headers: SB()
  }).catch(()=>{});
}

async function load(){
  if (!LIVE) return [];
  const out = [];
  for (let o = 0; o < 50000; o += 1000){
    const r = await fetch(
      `${CONFIG.SUPABASE_URL}/rest/v1/holders?select=wallet,name,amount,first_seen,angle,jitter&order=first_seen.asc&limit=1000&offset=${o}`,
      { headers: SB() });
    if (!r.ok) throw new Error('load ' + r.status + ' ' + (await r.text()));
    const d = await r.json();
    out.push(...d);
    if (d.length < 1000) break;
  }
  return out;
}

// ─────────────────────────────────────────────
// sync
// ─────────────────────────────────────────────
let syncing = false;
async function sync(){
  if (!HELIUS || syncing) return;
  syncing = true;
  const btn = $('btn-sync');
  const prev = btn.textContent;
  btn.textContent = 'Syncing…';
  btn.disabled = true;
  try{
    const holders = await fetchTopHolders();
    await pushToSupabase(holders);
    rows = await load();
    prep();
    btn.textContent = 'Synced ✓';
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 2200);
  } catch(e){
    console.error('[nebula] sync failed:', e);
    btn.textContent = 'Sync failed';
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 4000);
  } finally {
    syncing = false;
  }
}

// ─────────────────────────────────────────────
// prep — build star array from rows
// ─────────────────────────────────────────────
function buildDust(){
  dust.length = 0;
  for (let i = 0; i < 320; i++){
    const t = Math.pow(Math.random(), .55);
    const r = 70 + t * (MAXR - 70);
    const ang = Math.random() * Math.PI * 2;
    const arm = Math.floor(ang / (Math.PI*2/3)) * (Math.PI*2/3);
    const base = arm + (ang - arm) * .72 + r * .0105;
    dust.push({
      r, base,
      off: (Math.random() - .5) * (20 + r*.10),
      ph : Math.random() * 6.28,
      sz : .5 + Math.random() * 1.1,
      hue: 240 + Math.random() * 70,     // cool blues & violets
      b  : .10 + Math.random() * .28,
      om : .05 * (220 / (r + 90))
    });
  }
}
buildDust();

function prep(){
  const now = Date.now();

  // dev wallet placeholder
  if (CONFIG.DEV_WALLET && !rows.some(r => r.wallet === CONFIG.DEV_WALLET)){
    rows.push({
      wallet: CONFIG.DEV_WALLET, name:'DEV', amount:0,
      first_seen: new Date(Date.now() - 180*864e5).toISOString(),
      angle: 0, jitter: .5, _placeholder: true
    });
  }

  stars = rows.map(r => ({
    w  : r.wallet,
    n  : r.name,
    a  : r.amount,
    t0 : new Date(r.first_seen).getTime(),
    ang: r.angle,
    j  : r.jitter,
    ph : r.jitter * 977 % 6.28,
    dev: r.wallet === CONFIG.DEV_WALLET,
    ghost: !!r._ghost,
    _placeholder: !!r._placeholder,
  }));

  // ghost star for connected wallet with no bag
  if (me && !stars.some(s => s.w === me)){
    const seed = [...me].reduce((h,c) => ((h<<5)-h + c.charCodeAt(0))|0, 0);
    const rnd = n => { const x = Math.sin(seed+n) * 10000; return x - Math.floor(x); };
    stars.push({
      w: me, n: null, a: 0, t0: now,
      ang: rnd(1)*6.2832, j: rnd(2), ph: rnd(3)*6.28,
      ghost: true, dev: false, _placeholder: false
    });
  }

  stars.sort((a,b) => a.t0 - b.t0);

  const n  = stars.length;
  const ma = stars.reduce((m,s) => Math.max(m, s.a), 1);

  stars.forEach((s, i) => {
    s.rank = i + 1;
    const t = n > 1 ? i/(n-1) : 0;
    s.t = t;
    s.r = 52 + Math.pow(t, .72) * (MAXR - 52);

    const ratio = s.a / ma;
    s.sz = 4 + Math.pow(ratio, .34) * 15;   // 4 → 19px core
    if (s.ghost || (s.dev && s.a === 0)) s.sz = Math.max(s.sz, 3);

    s.b = .55 + .45 * (1 - t);
    s.hue = 48 + t * 250;                    // gold → pink → violet
    s.col = `hsl(${s.hue} 100% ${62 + (1-t)*18}%)`;

    const arm = Math.floor(s.ang / (Math.PI*2/3)) * (Math.PI*2/3);
    s.base = arm + (s.ang - arm) * .42 + s.r * .0115;
    s.off  = (s.j - .5) * (40 + s.r * .15);
    s.om   = .05 * (220 / (s.r + 90));
  });

  // refresh references
  if (selected) selected = stars.find(s => s.w === selected.w) || null;
  mine = me ? stars.find(s => s.w === me) : null;

  // header stats
  const realHolders = stars.filter(s => !s.ghost && !s._placeholder);
  const total = realHolders.reduce((a,s) => a + s.a, 0);
  const stCount = $('st-count'), stAge = $('st-age'), stTotal = $('st-total');
  if (realHolders.length){
    stCount.innerHTML = `<b>${realHolders.length.toLocaleString()}</b> holders`;
    stAge.innerHTML   = `oldest <b>${dur(now - realHolders[0].t0)}</b>`;
    stTotal.innerHTML = `<b>${cmp.format(total)}</b> ${CONFIG.TICKER}`;
  } else {
    stCount.textContent = LIVE ? 'No holders yet' : 'Configure CONFIG';
    stAge.textContent = ''; stTotal.textContent = '';
  }

  // wallet panel + find button
  walletPanel();
  $('btn-find').hidden = !mine;
}

// ─────────────────────────────────────────────
// wallet
// ─────────────────────────────────────────────
const ph = () => window.phantom?.solana || window.solana;

async function connect(silent){
  const p = ph();
  if (!p || !p.isPhantom){
    if (!silent) window.open('https://phantom.app/', '_blank', 'noopener');
    return;
  }
  if (me){
    try{ await p.disconnect(); }catch(e){}
    me = null;
    $('btn-connect').textContent = 'Connect';
    return prep();
  }
  try{
    const r = await p.connect(silent ? { onlyIfTrusted:true } : undefined);
    me = r.publicKey.toString();
  }catch(e){ return; }
  prep();
  if (mine) zoomTo(mine);
}

function walletPanel(){
  const el = $('me');
  el.hidden = !me;
  if (!me) return;
  if (!mine){
    $('m1').textContent = 'No star yet';
    $('m2').textContent = `This wallet holds no ${CONFIG.TICKER}.`;
    $('nb').hidden = true;
    return;
  }
  if (mine.ghost){
    $('m1').textContent = 'Your star · #' + mine.rank;
    $('m2').innerHTML = `No bag yet — buy some ${CONFIG.TICKER} to grow your star and start your clock.`;
    $('nb').hidden = true;
    return;
  }
  $('nb').hidden = false;
  $('m1').textContent = (mine.n || 'Your star') + ' · #' + mine.rank;
  $('m2').textContent = `Held ${dur(Date.now() - mine.t0)} · ${cmp.format(mine.a)} ${CONFIG.TICKER}`;
  $('btn-connect').textContent = short(me);
}

$('sv').onclick = async () => {
  const name = $('nm').value.trim().replace(/[\u0000-\u001f\u007f]/g,'').slice(0,20);
  if (!name || !mine || !me || mine.ghost) return;
  try{
    const p = ph();
    if (p?.signMessage){
      const ts = Date.now();
      try{ await p.signMessage(new TextEncoder().encode(`name:${name}:${ts}`), 'utf8'); }
      catch(e){ return; }
    }
    if (LIVE){
      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/holders?wallet=eq.${encodeURIComponent(me)}`, {
        method:'PATCH', headers: SB(), body: JSON.stringify({ name })
      });
      if (!r.ok){ console.error('save failed', r.status, await r.text()); return; }
    }
    mine.n = name;
    const row = rows.find(x => x.wallet === me);
    if (row) row.name = name;
    walletPanel();
    $('nm').value = '';
  }catch(e){ console.error(e); }
};

$('btn-connect').onclick = () => connect(false);
$('btn-find').onclick = () => { if (mine) zoomTo(mine); };
$('btn-sync').onclick = () => sync();

// ─────────────────────────────────────────────
// selection panel
// ─────────────────────────────────────────────
function openPanel(s){
  $('p-eyebrow').textContent = s.ghost ? 'Your wallet'
                            : s.dev && s.a === 0 ? 'Dev'
                            : 'Holder';
  $('p-name').textContent = s.ghost ? 'You'
                          : s.dev && s.a === 0 ? 'DEV'
                          : (s.n || 'Anonymous');
  $('p-addr').textContent = s.w;
  $('p-bal').textContent  = s.ghost ? `0 ${CONFIG.TICKER}` : `${cmp.format(s.a)} ${CONFIG.TICKER}`;
  $('p-held').textContent = s.ghost ? 'No bag yet' : dur(Date.now() - s.t0);
  $('p-rank').textContent = `#${s.rank} of ${stars.length}`;
  $('p-scan').href        = CONFIG.EXPLORER + s.w;
  $('panel').classList.add('open');
  $('panel').setAttribute('aria-hidden','false');
}

function closePanel(){
  $('panel').classList.remove('open');
  $('panel').setAttribute('aria-hidden','true');
  selected = null;
  camTarget = null;
}

function selectStar(s){
  if (!s) return closePanel();
  selected = s;
  openPanel(s);
  zoomTo(s);
}

function zoomTo(s){
  const p = pos(s);
  camTarget = { x: p.x, y: p.y, z: 3.2 };
}

$('p-close').onclick = () => closePanel();
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// ─────────────────────────────────────────────
// input
// ─────────────────────────────────────────────
cv.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY };
  down = { x: e.clientX, y: e.clientY, t: Date.now() };
  cv.classList.add('d');
  camTarget = null;
});
cv.addEventListener('pointermove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (drag){
    cam.x -= (e.clientX - drag.x) / cam.z;
    cam.y -= (e.clientY - drag.y) / cam.z;
    drag.x = e.clientX;
    drag.y = e.clientY;
  }
});
function endPointer(e, isUp){
  if (isUp && down){
    const dx = e.clientX - down.x;
    const dy = e.clientY - down.y;
    const moved = Math.hypot(dx, dy);
    if (moved < 6 && Date.now() - down.t < 500){
      if (hov) selectStar(selected === hov ? null : hov);
      else closePanel();
    }
  }
  drag = null; down = null;
  cv.classList.remove('d');
}
cv.addEventListener('pointerup',   e => endPointer(e, true));
cv.addEventListener('pointerleave',() => endPointer(null, false));
cv.addEventListener('pointercancel',()=> endPointer(null, false));

function zoom(f, mx = W/2, my = H/2){
  const wx = (mx - W/2)/cam.z + cam.x;
  const wy = (my - H/2)/cam.z + cam.y;
  cam.z = Math.min(6, Math.max(.3, cam.z * f));
  cam.x = wx - (mx - W/2)/cam.z;
  cam.y = wy - (my - H/2)/cam.z;
  camTarget = null;
}
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.12 : .89, e.clientX, e.clientY);
}, { passive:false });

$('zi').onclick = () => zoom(1.3);
$('zo').onclick = () => zoom(.77);

// ─────────────────────────────────────────────
// render
// ─────────────────────────────────────────────
const pos = s => {
  const a = s.base + s.om * T;
  const c = Math.cos(a), n = Math.sin(a);
  return {
    x: c*s.r - n*s.off,
    y: (n*s.r + c*s.off) * .62
  };
};

function frame(ts){
  T = ts / 1000;

  // camera follow
  if (selected){
    const p = pos(selected);
    camTarget = { x: p.x, y: p.y, z: 3.2 };
  }
  if (camTarget){
    cam.x += (camTarget.x - cam.x) * .08;
    cam.y += (camTarget.y - cam.y) * .08;
    cam.z += (camTarget.z - cam.z) * .06;
  }

  // background
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.fillStyle = '#03010a';
  g.fillRect(0, 0, W, H);

  // nebula wash
  const nebSize = 1600 * cam.z;
  const nebX = W/2 - cam.x * cam.z;
  const nebY = H/2 - cam.y * cam.z * .8;
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = .8;
  g.drawImage(nebula, nebX - nebSize/2, nebY - nebSize/2, nebSize, nebSize);

  // dust particles
  g.globalCompositeOperation = 'lighter';
  for (const d of dust){
    const a = d.base + d.om * T;
    const c = Math.cos(a), n = Math.sin(a);
    const x = W/2 + (c*d.r - n*d.off - cam.x) * cam.z;
    const y = H/2 + ((n*d.r + c*d.off)*.62 - cam.y) * cam.z;
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    const tw = .6 + .4 * Math.sin(T*1.6 + d.ph);
    g.globalAlpha = d.b * tw;
    g.fillStyle = `hsl(${d.hue} 85% 72%)`;
    const r = Math.max(.5, d.sz * Math.sqrt(cam.z) * .9);
    g.beginPath();
    g.arc(x, y, r, 0, 7);
    g.fill();
  }

  // stars
  g.globalCompositeOperation = 'lighter';
  let bestHov = null, bestDist = 18;
  for (const s of stars){
    const p = pos(s);
    s.sx = W/2 + (p.x - cam.x) * cam.z;
    s.sy = H/2 + (p.y - cam.y) * cam.z;
    if (s.sx < -160 || s.sx > W + 160 || s.sy < -160 || s.sy > H + 160) continue;

    const tw = .82 + .18 * Math.sin(T*2.2 + s.ph*3);
    const drawSize = s.sz * cam.z * 5.2 * tw;
    const sprite = getSprite(s.hue);

    g.globalAlpha = s.ghost ? .55 : s.b;
    g.drawImage(sprite, s.sx - drawSize/2, s.sy - drawSize/2, drawSize, drawSize);

    // dev ring
    if (s.dev){
      g.globalAlpha = .9;
      g.strokeStyle = '#ffd98a';
      g.lineWidth = 1.6;
      g.beginPath();
      g.arc(s.sx, s.sy, s.sz*cam.z*1.2 + 6, 0, 7);
      g.stroke();
    }

    // hit test
    const hitR = Math.max(14, s.sz * cam.z * 1.4);
    const d = Math.hypot(s.sx - mouse.x, s.sy - mouse.y);
    if (d < hitR && !drag && !selected){     // no hover while panel is open
      if (d < bestDist){ bestDist = d; bestHov = s; }
    }
  }
  hov = bestHov;

  // ring overlay for hover / selected / mine
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  cv.classList.toggle('h', !!(hov || selected) && !drag);

  const rings = new Set();
  if (hov && hov !== selected) rings.add(hov);
  if (selected) rings.add(selected);
  if (mine && mine !== selected && mine !== hov) rings.add(mine);

  for (const s of rings){
    const isSel = s === selected;
    const isMine = s === mine;
    const isGhost = s.ghost;
    const k = isMine ? 20 + 3*Math.sin(T*4) : 14;

    if (isSel){
      // rotating outer rays
      g.save();
      g.translate(s.sx, s.sy);
      g.rotate(T * .35);
      g.strokeStyle = 'rgba(155,199,255,.85)';
      g.lineWidth = 1.2;
      for (let i = 0; i < 6; i++){
        g.rotate(Math.PI / 3);
        g.beginPath();
        g.moveTo(0, -(k + 6));
        g.lineTo(0, -(k + 22));
        g.stroke();
      }
      g.restore();

      // chromatic ring pulse
      const pulse = 1 + .12 * Math.sin(T * 3.2);
      g.strokeStyle = 'rgba(155,199,255,.95)';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(s.sx, s.sy, (k + 4) * pulse, 0, 7);
      g.stroke();
    }

    if (isMine && isGhost){
      g.setLineDash([5, 5]);
      g.strokeStyle = 'rgba(255,255,255,.75)';
      g.lineWidth = 1.6;
      g.beginPath();
      g.arc(s.sx, s.sy, k, 0, 7);
      g.stroke();
      g.setLineDash([]);
    } else {
      g.strokeStyle = isMine ? '#fff'
                    : isSel  ? 'rgba(200,220,255,.9)'
                    : 'rgba(255,255,255,.65)';
      g.lineWidth = isMine ? 2 : isSel ? 1.6 : 1.2;
      g.beginPath();
      g.arc(s.sx, s.sy, k, 0, 7);
      g.stroke();
    }

    if (isMine){
      g.fillStyle = '#fff';
      g.font = '600 12px Space Grotesk, sans-serif';
      g.fillText(isGhost ? 'YOU' : (s.dev ? 'YOU · DEV' : 'YOU'), s.sx + 24, s.sy + 4);
      const lg = g.createLinearGradient(s.sx, s.sy - 320, s.sx, s.sy);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(1, 'rgba(255,255,255,.55)');
      g.strokeStyle = lg;
      g.beginPath();
      g.moveTo(s.sx, s.sy - 320);
      g.lineTo(s.sx, s.sy - k);
      g.stroke();
    }
  }

  // hover tooltip (never while panel open)
  const tp = $('tip');
  if (!selected && hov){
    tp.style.display = 'block';
    const label = hov.ghost ? 'You — no bag yet'
                : hov.dev && hov.a === 0 ? 'DEV'
                : (hov.n ? hov.n.replace(/</g,'&lt;') : 'Holder');
    const badge = hov.ghost ? '' : (hov === mine ? ' (you)' : '');
    const amt = hov.ghost ? `<i>Buy ${CONFIG.TICKER} to grow your star</i>`
              : `<i>${cmp.format(hov.a)} ${CONFIG.TICKER}</i>`;
    tp.innerHTML = `<b>${label}</b>${badge}<br>${short(hov.w)}<br>Held <b>${dur(Date.now() - hov.t0)}</b> <i>· rank #${hov.rank}</i><br>${amt}<span class="go">CLICK TO INSPECT</span>`;
    const tw = tp.offsetWidth, th = tp.offsetHeight;
    tp.style.left = Math.min(W - tw - 12, mouse.x + 18) + 'px';
    tp.style.top  = Math.min(H - th - 12, mouse.y + 18) + 'px';
  } else {
    tp.style.display = 'none';
  }

  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────────
// boot
// ─────────────────────────────────────────────
(async () => {
  $('btn-sync').hidden = !HELIUS;

  // 1) instant paint from Supabase (works even if offline)
  try { rows = await load(); } catch(e){ console.warn('[nebula] load failed', e); rows = []; }
  prep();

  // 2) start render loop
  requestAnimationFrame(frame);

  // 3) background: sync from Helius
  if (HELIUS){
    sync().catch(e => console.warn('[nebula] initial sync failed', e));
  }

  // 4) silent phantom reconnect
  connect(true);

  // 5) periodic refresh
  if (LIVE && HELIUS){
    setInterval(() => sync().catch(()=>{}), CONFIG.REFRESH_MS);
  }
})();
</script>
</body></html>
